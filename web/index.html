<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Static defaults for standalone hosting. A server that renders per-route tags replaces
         the marker below with its own title, description, OpenGraph and JSON-LD. -->
    <title>AgentFund · Fund software in tokens</title>
    <meta
      name="description"
      content="Fund software in tokens. Back a project by lending your coding agent: it runs signed tasks on your machine, under your caps, and a token counts only once CI passes. Run it on a public instance or inside your company."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AgentFund · Fund software in tokens" />
    <meta
      property="og:description"
      content="Back a project by lending your coding agent. Signed tasks, your caps, and a token counts only once CI passes."
    />
    <meta name="twitter:card" content="summary" />
    <!--app-head-->
    <script>
      // Apply the theme before first paint (saved choice, else the system setting) so the
      // page never flashes the other palette.
      try {
        var saved = localStorage.getItem('agentfund.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This interface needs JavaScript. The same data is available as JSON under /v1/.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
