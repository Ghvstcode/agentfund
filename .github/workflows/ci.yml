name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:check

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server lint
      - run: pnpm --filter server test   # Testcontainers Postgres; Docker is preinstalled on the runner
      - run: pnpm --filter server build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: worker }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: worker/go.mod, cache-dependency-path: worker/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Full-cost key encryption (1 GiB scrypt) is skipped under -race; cover it here.
      - run: go test -count=1 -run 'KeygenWithPassword|DefaultCost' ./internal/cli ./internal/minisign

  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: worker/go.mod, cache-dependency-path: worker/go.sum }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: worker
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/agentfund ./cmd/agentfund

  egress-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: images/egress-proxy }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  e2e:
    # The full acceptance loop against a mock Claude: no real tokens are spent in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [spec, server, worker, egress-proxy]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version-file: worker/go.mod, cache-dependency-path: worker/go.sum }
      - run: sh scripts/e2e.sh
