# GoReleaser configuration for the AgentFund worker CLI.
#   goreleaser check
#   goreleaser build --snapshot --clean      # local binaries under worker/dist
#   goreleaser release --clean               # on a tag: archives + checksums
version: 2
project_name: agentfund
dist: worker/dist

builds:
  - id: agentfund
    dir: worker
    main: ./cmd/agentfund
    binary: agentfund
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ghvstcode/agentfund/worker/internal/app.Version={{ .Version }}
      - -X github.com/ghvstcode/agentfund/worker/internal/app.Commit={{ .ShortCommit }}
      - -X github.com/ghvstcode/agentfund/worker/internal/app.Date={{ .CommitDate }}
      # The release workflow sets these to the digests it just pushed; a local snapshot keeps the
      # images built from the checkout.
      - -X github.com/ghvstcode/agentfund/worker/internal/config.DefaultSandboxImage={{ envOrDefault "RELEASE_SANDBOX_IMAGE" "agentfund/sandbox:dev" }}
      - -X github.com/ghvstcode/agentfund/worker/internal/config.DefaultEgressProxyImage={{ envOrDefault "RELEASE_EGRESS_PROXY_IMAGE" "agentfund/egress-proxy:dev" }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: agentfund
    ids: [agentfund]
    formats: [tar.gz]
    # agentfund_<version>_<os>_<arch>.tar.gz — scripts/install.sh relies on this name.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: worker/README.md
        dst: README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true

release:
  # scripts/install.sh downloads from the same repository
  # (override there with AGENTFUND_REPO).
  github:
    owner: ghvstcode
    name: agentfund
  # Published as soon as it is built: install.sh installs GitHub's "latest" release, which skips
  # drafts. A tag with a suffix (v1.2.3-rc1) is a pre-release and never becomes latest.
  draft: false
  prerelease: auto
